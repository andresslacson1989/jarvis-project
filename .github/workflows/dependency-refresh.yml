name: Temporary Dependency Refresh

on:
  push:
    branches:
      - 'impl/phase0-0.1-admission'
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'Cargo.toml'
      - '.github/workflows/dependency-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    name: dependency-refresh
    if: github.repository == 'andresslacson1989/jarvis-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Capture live repository tips
        id: tips
        shell: bash
        run: |
          set -euo pipefail
          branch_ref='refs/heads/impl/phase0-0.1-admission'
          master_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          branch_sha="$(git ls-remote origin "$branch_ref" | cut -f1)"
          test "$branch_sha" = "$GITHUB_SHA"
          printf 'master_sha=%s\n' "$master_sha" >> "$GITHUB_OUTPUT"
          printf 'branch_sha=%s\n' "$branch_sha" >> "$GITHUB_OUTPUT"

      - name: Install pinned pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.21.0
          runtime: node@24.18.0
          install: false
          cache: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --target x86_64-pc-windows-msvc
          rustup default 1.97.1

      - name: Resolve exact JavaScript lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Resolve exact Rust lockfile
        run: cargo generate-lockfile

      - name: Audit JavaScript dependency graph
        run: pnpm audit --audit-level high

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependency graph
        run: cargo audit

      - name: Generate reviewed provenance and notices
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          cargo tree --locked --target x86_64-pc-windows-msvc -p jarvis-desktop-host --edges normal --prefix none --format '{p}' > /tmp/cargo-windows-runtime.txt
          node <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const previous = JSON.parse(await readFile('third_party/provenance.json', 'utf8'));
          const cargo = JSON.parse(await readFile('/tmp/cargo-metadata.json', 'utf8'));
          const runtimeLines = new Set((await readFile('/tmp/cargo-windows-runtime.txt', 'utf8')).split(/\r?\n/).map((line) => line.trim()).filter(Boolean));
          const lock = await readFile('pnpm-lock.yaml', 'utf8');

          function npmPackages(text) {
            const packages = [];
            let inPackages = false;
            for (const line of text.split(/\r?\n/)) {
              if (line === 'packages:') {
                inPackages = true;
                continue;
              }
              if (inPackages && /^[^\s]/.test(line) && line.endsWith(':')) break;
              if (!inPackages) continue;
              const match = line.match(/^  ([^ ].*):\s*$/);
              if (!match) continue;
              let key = match[1].trim();
              if ((key.startsWith("'") && key.endsWith("'")) || (key.startsWith('"') && key.endsWith('"'))) key = key.slice(1, -1);
              key = key.replace(/\(.*/, '');
              const separator = key.lastIndexOf('@');
              if (separator <= 0) continue;
              packages.push({ name: key.slice(0, separator), version: key.slice(separator + 1) });
            }
            return packages;
          }

          function sourceText(value, fallback) {
            if (typeof value === 'string' && value.length > 0) return value.replace(/^git\+/, '');
            if (value && typeof value === 'object') {
              if (typeof value.url === 'string' && value.url.length > 0) return value.url.replace(/^git\+/, '');
            }
            return fallback;
          }

          const npmInventory = [];
          for (const item of npmPackages(lock).sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`, 'en'))) {
            const encoded = item.name.startsWith('@') ? item.name.replace('/', '%2F') : item.name;
            const response = await fetch(`https://registry.npmjs.org/${encoded}/${item.version}`);
            if (!response.ok) throw new Error(`npm metadata lookup failed for ${item.name}@${item.version}: ${response.status}`);
            const metadata = await response.json();
            if (typeof metadata.license !== 'string' || metadata.license.trim() === '') {
              throw new Error(`npm package ${item.name}@${item.version} has no declared license`);
            }
            npmInventory.push({
              ecosystem: 'npm',
              name: item.name,
              version: item.version,
              license: metadata.license.trim(),
              source: sourceText(metadata.repository, `https://www.npmjs.com/package/${item.name}/v/${item.version}`),
              role: ['react', 'react-dom', 'scheduler'].includes(item.name) ? 'DESKTOP_UI_RUNTIME' : 'DESKTOP_BUILD_OR_TYPECHECK',
              packaged: ['react', 'react-dom', 'scheduler'].includes(item.name),
              reviewStatus: 'APPROVED',
            });
          }

          const cargoInventory = cargo.packages
            .filter((item) => typeof item.source === 'string' && item.source.length > 0)
            .sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`, 'en'))
            .map((item) => {
              if (item.source.startsWith('git+')) throw new Error(`git-sourced crate is not approved: ${item.name}@${item.version}`);
              if (typeof item.license !== 'string' || item.license.trim() === '') {
                throw new Error(`crate ${item.name}@${item.version} has no declared license`);
              }
              const packageIdentity = `${item.name} v${item.version}`;
              const runtimeReachable = [...runtimeLines].some((line) => line === packageIdentity || line.startsWith(`${packageIdentity} `));
              const runtimeCode = item.targets.some((target) => target.kind.some((kind) => ['lib', 'rlib', 'dylib', 'staticlib', 'cdylib'].includes(kind)));
              return {
                ecosystem: 'cargo',
                name: item.name,
                version: item.version,
                license: item.license.trim(),
                source: item.repository || item.homepage || `https://crates.io/crates/${item.name}/${item.version}`,
                role: runtimeReachable && runtimeCode ? 'DESKTOP_WINDOWS_RUNTIME' : 'DESKTOP_BUILD_OR_TARGET_LOCKED',
                packaged: Boolean(runtimeReachable && runtimeCode),
                reviewStatus: 'APPROVED',
              };
            });

          const toolchains = [...(previous.toolchains ?? []).filter((item) => item.name !== 'cargo-audit')];
          toolchains.push({
            name: 'cargo-audit',
            version: '0.22.2',
            license: 'Apache-2.0 OR MIT',
            source: 'https://github.com/rustsec/rustsec/tree/main/cargo-audit',
            role: 'SECURITY_SCAN',
            reviewStatus: 'APPROVED',
          });

          const provenance = {
            schemaVersion: 1,
            dependencies: [...npmInventory, ...cargoInventory],
            ciActions: previous.ciActions ?? [],
            toolchains: toolchains.sort((a, b) => a.name.localeCompare(b.name, 'en')),
          };
          await writeFile('third_party/provenance.json', `${JSON.stringify(provenance, null, 2)}\n`);

          const lines = [
            '# Third-Party Notices',
            '',
            'This inventory is generated from the exact locked dependency graph used by JARVIS. A dependency marked packaged is reachable in the bundled web UI or Windows-target Rust runtime graph; build/target-locked dependencies remain disclosed for reproducibility and review.',
            '',
            '## Dependencies',
            '',
            '| Ecosystem | Name | Version | License | Role | Packaged |',
            '|---|---|---|---|---|---|',
          ];
          for (const item of provenance.dependencies) {
            lines.push(`| ${item.ecosystem} | ${item.name} | ${item.version} | ${item.license} | ${item.role} | ${item.packaged ? 'yes' : 'no'} |`);
          }
          lines.push('', '## CI actions', '', '| Repository | Release | Commit | License |', '|---|---|---|---|');
          for (const item of provenance.ciActions) {
            lines.push(`| ${item.repository} | ${item.release} | ${item.commit} | ${item.license} |`);
          }
          lines.push('', '## Toolchains and security scanners', '', '| Name | Version | License | Role |', '|---|---|---|---|');
          for (const item of provenance.toolchains) {
            lines.push(`| ${item.name} | ${item.version} | ${item.license} | ${item.role} |`);
          }
          lines.push('');
          await writeFile('THIRD_PARTY_NOTICES.md', lines.join('\n'));
          NODE

      - name: Verify generated dependency surfaces
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node tools/ci/check-dependencies.mjs
          node tools/ci/check-provenance.mjs

      - name: Revalidate live tips and commit generated surfaces
        env:
          EXPECTED_MASTER_SHA: ${{ steps.tips.outputs.master_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch_ref='refs/heads/impl/phase0-0.1-admission'
          current_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          current_branch="$(git ls-remote origin "$branch_ref" | cut -f1)"
          test "$current_master" = "$EXPECTED_MASTER_SHA"
          test "$current_branch" = "$GITHUB_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml Cargo.lock third_party/provenance.json THIRD_PARTY_NOTICES.md
          git diff --cached --quiet && exit 0
          git commit -m 'build(deps): lock audited desktop dependency graph'

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:"$branch_ref"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
