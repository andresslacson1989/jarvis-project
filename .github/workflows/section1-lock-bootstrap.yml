name: Section 1 Lock Bootstrap

on:
  push:
    branches:
      - 'impl/section1-1.1-tauri-react'

permissions:
  contents: write

jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.21.0
          runtime: node@24.18.0
          install: false
          cache: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Stage intended manifests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = {
            'dev:web': 'vite --host 127.0.0.1 --port 5173 --strictPort',
            'build:web': 'tsc -p tsconfig.json --noEmit && vite build',
            'tauri': 'tauri'
          };
          pkg.dependencies = {
            '@tauri-apps/api': '2.11.1',
            'react': '19.2.8',
            'react-dom': '19.2.8'
          };
          pkg.devDependencies = {
            '@tauri-apps/cli': '2.11.4',
            '@types/react': '19.2.17',
            '@types/react-dom': '19.2.3',
            '@vitejs/plugin-react': '6.0.3',
            'vite': '8.1.5'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "3"
          members = ["tools/toolchain/rust-smoke", "apps/desktop/src-tauri"]
          default-members = ["tools/toolchain/rust-smoke", "apps/desktop/src-tauri"]

          [workspace.package]
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.97.1"
          EOF

          mkdir -p apps/desktop/src-tauri/src
          cat > apps/desktop/src-tauri/Cargo.toml <<'EOF'
          [package]
          name = "jarvis-desktop"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          publish = false

          [build-dependencies]
          tauri-build = "=2.6.3"

          [target.'cfg(target_os = "windows")'.dependencies]
          tauri = "=2.11.5"
          EOF
          printf 'fn main() {}\n' > apps/desktop/src-tauri/src/main.rs

      - name: Generate exact locks and metadata
        shell: bash
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --ignore-scripts
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          pnpm list --prod --depth Infinity --json > /tmp/pnpm-prod.json

      - name: Generate provenance metadata
        run: node .github/scripts/section1-bootstrap-provenance.mjs

      - name: Revalidate master and capture generated files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin master
          test "$(git rev-parse FETCH_HEAD)" = "db6731650d472aa2faa002cf4f0402cc59370768"
          mkdir -p .bootstrap
          cp /tmp/npm-provenance.json .bootstrap/npm-provenance.json
          cp /tmp/cargo-provenance.json .bootstrap/cargo-provenance.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml Cargo.lock .bootstrap/npm-provenance.json .bootstrap/cargo-provenance.json
          if git diff --cached --quiet; then
            echo "generated dependency state already captured"
            exit 0
          fi
          git commit -m "build(1.1): capture generated lockfiles and provenance"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
