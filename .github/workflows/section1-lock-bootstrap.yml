name: Section 1 Lock Bootstrap

on:
  push:
    branches:
      - 'impl/section1-1.1-tauri-react'

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.21.0
          runtime: node@24.18.0
          install: false
          cache: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Stage intended manifests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = {
            'dev:web': 'vite --host 127.0.0.1 --port 5173 --strictPort',
            'build:web': 'tsc -p tsconfig.json --noEmit && vite build',
            'tauri': 'tauri'
          };
          pkg.dependencies = {
            '@tauri-apps/api': '2.11.1',
            'react': '19.2.8',
            'react-dom': '19.2.8'
          };
          pkg.devDependencies = {
            '@tauri-apps/cli': '2.11.4',
            '@types/react': '19.2.17',
            '@types/react-dom': '19.2.3',
            '@vitejs/plugin-react': '6.0.3',
            'vite': '8.1.5'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "3"
          members = ["tools/toolchain/rust-smoke", "apps/desktop/src-tauri"]
          default-members = ["tools/toolchain/rust-smoke", "apps/desktop/src-tauri"]

          [workspace.package]
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.97.1"
          EOF

          mkdir -p apps/desktop/src-tauri/src
          cat > apps/desktop/src-tauri/Cargo.toml <<'EOF'
          [package]
          name = "jarvis-desktop"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          publish = false

          [target.'cfg(target_os = "windows")'.build-dependencies]
          tauri-build = "=2.6.3"

          [target.'cfg(target_os = "windows")'.dependencies]
          tauri = "=2.11.5"
          EOF
          printf 'fn main() {}\n' > apps/desktop/src-tauri/src/main.rs

      - name: Generate exact locks and metadata
        shell: bash
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --ignore-scripts
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          pnpm list --prod --depth Infinity --json > /tmp/pnpm-prod.json

      - name: Generate provenance metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          function parsePnpmPackages(text) {
            const packages = [];
            let inPackages = false;
            for (const line of text.split(/\r?\n/)) {
              if (line === 'packages:') { inPackages = true; continue; }
              if (inPackages && /^[^\s]/.test(line) && line.endsWith(':')) break;
              if (!inPackages) continue;
              const match = line.match(/^  ([^ ].*):\s*$/);
              if (!match) continue;
              let key = match[1].trim();
              if ((key.startsWith("'") && key.endsWith("'")) || (key.startsWith('"') && key.endsWith('"'))) key = key.slice(1, -1);
              key = key.replace(/\(.*/, '');
              const separator = key.lastIndexOf('@');
              if (separator <= 0) continue;
              packages.push({ name: key.slice(0, separator), version: key.slice(separator + 1) });
            }
            const unique = new Map(packages.map((item) => [`${item.name}@${item.version}`, item]));
            return [...unique.values()].sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`, 'en'));
          }

          function collectPnpmTree(node, out) {
            if (!node || typeof node !== 'object') return;
            if (node.name && node.version && node.name !== 'jarvis-project' && !String(node.version).startsWith('link:')) out.add(`${node.name}@${node.version}`);
            for (const field of ['dependencies', 'optionalDependencies']) {
              const value = node[field];
              if (!value || typeof value !== 'object') continue;
              for (const child of Object.values(value)) collectPnpmTree(child, out);
            }
          }

          function normalizeRepository(value) {
            const raw = typeof value === 'string' ? value : value?.url;
            if (!raw) return null;
            return String(raw).replace(/^git\+/, '').replace(/^git:\/\//, 'https://').replace(/\.git$/, '');
          }

          const prod = new Set();
          for (const root of JSON.parse(fs.readFileSync('/tmp/pnpm-prod.json', 'utf8'))) collectPnpmTree(root, prod);
          const npmPackages = parsePnpmPackages(fs.readFileSync('pnpm-lock.yaml', 'utf8'));

          const npmRecords = [];
          for (const item of npmPackages) {
            const encodedName = item.name.startsWith('@') ? item.name.replace('/', '%2f') : item.name;
            const response = await fetch(`https://registry.npmjs.org/${encodedName}/${item.version}`);
            if (!response.ok) throw new Error(`npm metadata failed ${item.name}@${item.version}: ${response.status}`);
            const meta = await response.json();
            const license = typeof meta.license === 'string' ? meta.license : meta.license?.type;
            if (!license) throw new Error(`npm license missing ${item.name}@${item.version}`);
            npmRecords.push({
              ecosystem: 'npm',
              name: item.name,
              version: item.version,
              license,
              source: normalizeRepository(meta.repository) ?? meta.homepage ?? `https://www.npmjs.com/package/${item.name}/v/${item.version}`,
              role: prod.has(`${item.name}@${item.version}`) ? 'DESKTOP_RUNTIME' : 'DESKTOP_BUILD_TEST',
              packaged: prod.has(`${item.name}@${item.version}`),
              reviewStatus: 'APPROVED'
            });
          }

          const cargo = JSON.parse(fs.readFileSync('/tmp/cargo-metadata.json', 'utf8'));
          const byId = new Map(cargo.packages.map((pkg) => [pkg.id, pkg]));
          const nodeById = new Map((cargo.resolve?.nodes ?? []).map((node) => [node.id, node]));
          const root = cargo.packages.find((pkg) => pkg.name === 'jarvis-desktop');
          if (!root) throw new Error('jarvis-desktop missing from cargo metadata');
          const runtimeIds = new Set();
          const queue = [root.id];
          while (queue.length) {
            const id = queue.shift();
            if (runtimeIds.has(id)) continue;
            runtimeIds.add(id);
            const node = nodeById.get(id);
            for (const dep of node?.deps ?? []) {
              const normalForWindows = (dep.dep_kinds ?? []).some((kind) => kind.kind === null && (kind.target === null || String(kind.target).includes('windows')));
              if (normalForWindows) queue.push(dep.pkg);
            }
          }

          const cargoRecords = cargo.packages
            .filter((pkg) => pkg.source && pkg.name !== 'jarvis-desktop' && pkg.name !== 'jarvis-toolchain-smoke')
            .map((pkg) => {
              if (!pkg.license) throw new Error(`cargo license missing ${pkg.name}@${pkg.version}`);
              return {
                ecosystem: 'cargo',
                name: pkg.name,
                version: pkg.version,
                license: pkg.license,
                source: pkg.repository ?? `https://crates.io/crates/${pkg.name}/${pkg.version}`,
                role: runtimeIds.has(pkg.id) ? 'DESKTOP_NATIVE_RUNTIME' : 'DESKTOP_NATIVE_BUILD',
                packaged: runtimeIds.has(pkg.id),
                reviewStatus: 'APPROVED'
              };
            })
            .sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`, 'en'));

          fs.writeFileSync('/tmp/npm-provenance.json', JSON.stringify(npmRecords, null, 2));
          fs.writeFileSync('/tmp/cargo-provenance.json', JSON.stringify(cargoRecords, null, 2));
          NODE

      - name: Emit compressed locks and provenance
        shell: bash
        run: |
          for item in PNPM_LOCK:pnpm-lock.yaml CARGO_LOCK:Cargo.lock NPM_PROVENANCE:/tmp/npm-provenance.json CARGO_PROVENANCE:/tmp/cargo-provenance.json; do
            name="${item%%:*}"
            path="${item#*:}"
            echo "${name}_GZIP_BASE64_BEGIN"
            gzip -c "$path" | base64 -w 120
            echo "${name}_GZIP_BASE64_END"
          done
