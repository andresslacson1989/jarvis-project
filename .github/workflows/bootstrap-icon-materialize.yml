name: Bootstrap Icon Materialize

on:
  push:
    branches:
      - impl/phase0-0.1-admission
    paths:
      - .github/workflows/bootstrap-icon-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    name: bootstrap-icon-materialize
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate deterministic non-canonical bootstrap ICO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import binascii
          import hashlib
          import pathlib
          import struct
          import zlib

          sizes = [16, 24, 32, 48, 64, 256]
          output = pathlib.Path("apps/desktop/src-tauri/icons/icon.ico")

          def chunk(kind: bytes, payload: bytes) -> bytes:
              return (
                  struct.pack(">I", len(payload))
                  + kind
                  + payload
                  + struct.pack(">I", binascii.crc32(kind + payload) & 0xFFFFFFFF)
              )

          def png(size: int) -> bytes:
              # Neutral, non-canonical opaque RGBA placeholder. Canonical identity belongs to 1.11.
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      edge = x in (0, size - 1) or y in (0, size - 1)
                      diag = x == y or x + y == size - 1
                      if edge:
                          rgba = (32, 38, 48, 255)
                      elif diag:
                          rgba = (154, 163, 175, 255)
                      else:
                          rgba = (62, 70, 84, 255)
                      row.extend(rgba)
                  rows.append(bytes(row))
              raw = b"".join(rows)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(raw, 9))
                  + chunk(b"IEND", b"")
              )

          payloads = [(size, png(size)) for size in sizes]
          directory_size = 6 + 16 * len(payloads)
          cursor = directory_size
          entries = []
          for size, payload in payloads:
              dimension = 0 if size == 256 else size
              entries.append(
                  struct.pack(
                      "<BBBBHHII",
                      dimension,
                      dimension,
                      0,
                      0,
                      1,
                      32,
                      len(payload),
                      cursor,
                  )
              )
              cursor += len(payload)

          ico = struct.pack("<HHH", 0, 1, len(payloads)) + b"".join(entries) + b"".join(
              payload for _, payload in payloads
          )
          output.write_bytes(ico)
          print(f"generated {output} bytes={len(ico)} sha256={hashlib.sha256(ico).hexdigest()}")
          PY

      - name: Validate generated ICO with repository contract test
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/layers/unit/desktop-workspace.test.mjs
          test "$(git status --porcelain)" = " M apps/desktop/src-tauri/icons/icon.ico"

      - name: Revalidate branch tip and push icon only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}"
          remote_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "${remote_sha}" = "${GITHUB_SHA}"
          test "$(git status --porcelain)" = " M apps/desktop/src-tauri/icons/icon.ico"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/icons/icon.ico
          git commit -m "fix(desktop): materialize valid bootstrap ICO"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
