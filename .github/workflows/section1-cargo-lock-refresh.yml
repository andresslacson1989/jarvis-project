name: Section 1 Cargo Lock Refresh

on:
  push:
    branches:
      - 'impl/section1-1.1-tauri-react'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --target x86_64-pc-windows-msvc
          rustup default 1.97.1

      - name: Regenerate exact Cargo lock
        shell: bash
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          node tools/ci/check-dependencies.mjs
          node tools/ci/check-provenance.mjs

      - name: Revalidate master and capture lock only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 "${AUTH_URL}" master
          test "$(git rev-parse FETCH_HEAD)" = "db6731650d472aa2faa002cf4f0402cc59370768"
          test -z "$(git status --short --untracked-files=no | grep -v '^ M Cargo.lock$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches the current manifest graph"
            exit 0
          fi
          git commit -m "build(1.1): refresh Cargo lock for Tauri pairing"
          git push "${AUTH_URL}" HEAD:${GITHUB_REF_NAME}
