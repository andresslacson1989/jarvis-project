name: Static CI

on:
  push:
    branches:
      - master
      - 'impl/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-ci:
    name: static-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Expected exact candidate SHA $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi

      - name: Install pinned pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.21.0
          runtime: node@24.18.0
          install: false
          cache: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          rustup default 1.97.1

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify exact toolchain
        run: pnpm toolchain:verify

      - name: Format hygiene
        run: pnpm format:check

      - name: Schema integrity
        run: pnpm schema:check

      - name: Generated contract artifacts
        run: pnpm contract:check-generated

      - name: Contract manifest
        run: pnpm contract:check-manifest

      - name: Contract and profile drift
        run: pnpm contract:check-drift

      - name: Repository governance
        run: pnpm governance:check

      - name: Secret scan
        run: pnpm security:secrets

      - name: Dependency inventory
        run: pnpm dependency:check

      - name: License and provenance
        run: pnpm provenance:check

      - name: TypeScript strict typecheck
        run: pnpm typecheck

      - name: TypeScript build
        run: pnpm build

      - name: Core build
        run: pnpm build:core

      - name: Desktop UI build
        run: pnpm build:ui

      - name: Desktop foundation contract
        run: pnpm desktop:foundation:check

      - name: Architecture enforcement
        run: pnpm architecture:check

      - name: Normal deterministic tests
        run: pnpm test

      - name: Node dependency vulnerability gate
        run: pnpm audit --audit-level high

      - name: Install Tauri host-check system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            llvm

          llvm_rc_path="$(command -v llvm-rc || true)"
          if [[ -z "$llvm_rc_path" ]]; then
            for llvm_bin_dir in /usr/lib/llvm-*/bin; do
              if [[ -x "$llvm_bin_dir/llvm-rc" ]]; then
                llvm_rc_path="$llvm_bin_dir/llvm-rc"
                break
              fi
            done
          fi
          if [[ -z "$llvm_rc_path" || ! -x "$llvm_rc_path" ]]; then
            echo "llvm-rc was not installed or could not be located" >&2
            exit 1
          fi
          llvm_bin_dir="$(dirname "$llvm_rc_path")"
          echo "$llvm_bin_dir" >> "$GITHUB_PATH"
          "$llvm_rc_path" --help >/dev/null

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy warnings-as-errors
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Rust host build
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Rust Windows-target build
        run: cargo check --locked --workspace --target x86_64-pc-windows-msvc

      - name: Desktop Tauri Windows build
        run: cargo check --locked -p jarvis-desktop --target x86_64-pc-windows-msvc

      - name: Phase 0 section checkpoint
        run: pnpm phase0:check

      - name: Static CI evidence
        env:
          JARVIS_STATIC_CI_GATES_PASSED: '1'
          JARVIS_PHASE0_CHECKPOINT_PASSED: '1'
        run: pnpm ci:evidence
