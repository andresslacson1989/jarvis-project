[package]
name = "jarvis-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = ["jarvis-windows-native/test-support"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = [] }
tauri-plugin-opener = "=2.5.4"
jarvis-windows-native = { path = "../../../platform/windows/native" }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
